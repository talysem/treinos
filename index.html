<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treinos</title>
  <link rel="stylesheet" href="css/style.css">

  <!-- Favicons tradicionais -->
  <link rel="icon" type="image/png" href="src/favicon-32x32.png">

  <!-- Android / PWA -->
  <link rel="icon" type="image/png" sizes="192x192" href="src/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="src/icon-512.png">

  <!-- iOS -->
  <link rel="apple-touch-icon" sizes="180x180" href="src/apple-touch-icon.png">
</head>

<body>

  <nav class="tabs">
    <button class="tab-btn active" data-screen="historico">Histórico</button>
    <button class="tab-btn" data-screen="treinos">Treinos</button>
    <button class="tab-btn" data-screen="registrar">Registrar</button>
  </nav>

  <!-- HISTÓRICO -->
  <section id="screen-historico" class="screen active">
    <div class="row-between">
      <h1>Histórico</h1>
      <button class="btn-config" aria-label="configurações">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z">
          </path>
        </svg>
      </button>
    </div>

    <div id="historico-analises">
      <div class="card">
        <div class="row-between">
          <h2>Calendário</h2>
          <span id="calendario-mes" class="hint"></span>
        </div>
        <div class="calendario-header-row">
          <span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span>
        </div>
        <div class="calendario-grid" id="calendario-grid"></div>
      </div>

      <div class="card">
        <h2>Estatísticas</h2>
        <div id="estatisticas-lista" class="stats-lista"></div>
      </div>

      <div class="card">
        <h2>Distribuição</h2>
        <div id="distribuicao-treino" class="dist-grupo"></div>
        <div id="distribuicao-dia-semana" class="dist-grupo"></div>
      </div>

      <div class="card" id="card-progressao">
        <h2>Progressão por exercício</h2>
        <select id="filtro-exercicio"></select>
        <canvas id="grafico" width="320" height="200"></canvas>
        <p id="grafico-vazio" class="hint hidden">Sem dados suficientes para esse exercício.</p>
      </div>
    </div>

    <div class="card">
      <div class="row-between">
        <h2>Sessões</h2>
        <div>
          <button id="btn-export" class="btn-secondary">Exportar</button>
          <label class="btn-secondary file-label">
            Importar
            <input type="file" id="input-import" accept="application/json" hidden>
          </label>
        </div>
      </div>
      <div id="lista-sessoes"></div>
    </div>
  </section>

  <!-- TREINOS -->
  <section id="screen-treinos" class="screen">
    <div class="row-between">
      <h1>Treinos</h1>
      <button class="btn-config" aria-label="configurações">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z">
          </path>
        </svg>
      </button>
    </div>
    <div id="lista-treinos"></div>
  </section>

  <!-- REGISTRAR -->
  <section id="screen-registrar" class="screen">
    <div class="row-between">
      <h1>Registrar</h1>
      <button class="btn-config" aria-label="configurações">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z">
          </path>
        </svg>
      </button>
    </div>
    <div class="card">

      <div class="register-group" id="registr-type">
        <label class="snd-font">Treino realizado:</label>
        <select id="select-treino-registrar"></select>
      </div>

      <div class="register-group">
        <h2 class="snd-font">Quando e duração</h2>

        <div class="row spc-btwn">
          <label for="check-data-hoje" class="snd-font">Treino realizado agora?</label>

          <label class="switch-input" for="check-data-hoje">
            <input type="checkbox" id="check-data-hoje" checked>
            <div>
              <svg width="9" height="7" viewBox="0 0 9 7" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M8.59094 0.76737L3.32367 6.03464L0 2.71097L0.76737 1.9436L3.32367 4.4999L7.82357 0L8.59094 0.76737Z"
                  fill="white" />
              </svg>
            </div>
          </label>
        </div>

        <div id="grupo-data-especifica" class="hidden full-width">
          <label class="snd-font">Quando realizou?</label>
          <input type="datetime-local" id="input-data-especifica">
        </div>

        <div class="full-width">
          <label class="snd-font">Duração (minutos):</label>
          <input type="number" id="input-duracao" min="0" placeholder="Ex.: 60">
        </div>
      </div>

      <div class="register-group" id="grupo-treino-normal">
        <h2 class="snd-font">Treinos</h2>
        <div id="form-exercicios-registrar" class="full-width"></div>
      </div>

      <div class="register-group hidden" id="grupo-avulso">
        <h2 class="snd-font">Treino avulso</h2>
        <label>Nome do treino (opcional):</label>
        <input type="text" id="input-nome-avulso" placeholder="Ex.: Treino com o Fulano">
        <div id="form-exercicios-avulso" class="full-width"></div>
        <button type="button" class="btn-add" id="btn-add-exercicio-avulso">+ adicionar exercício</button>
      </div>

      <label>Observação:</label>
      <textarea id="observacao-sessao" rows="3" placeholder="Como foi o treino?"></textarea>
      <button id="btn-salvar-sessao" class="btn-primary">Registrar sessão</button>
      <p id="msg-sessao-salva" class="hint hidden">Sessão salva!</p>
    </div>
  </section>

  <!-- CONFIGURAÇÕES -->
  <section id="screen-config" class="screen">
    <div class="row-between">
      <h1>Configurações</h1>
      <button id="btn-voltar-config" class="btn-secondary">Voltar</button>
    </div>
    <div class="card">
      <label>Cor primária</label>
      <input type="color" id="input-cor-primaria">
      <button id="btn-resetar-cor" class="btn-secondary">Restaurar padrão</button>
    </div>

    <div class="card">
      <label>Meta semanal de treinos</label>
      <input type="number" id="input-meta-semanal" min="1" placeholder="Ex.: 3">
    </div>
  </section>

  <!-- MODO FOCO -->
  <div id="modo-foco-overlay" class="modo-foco hidden">
    <div class="modo-foco-topo">
      <h1 id="modo-foco-titulo"></h1>
      <button id="btn-sair-modo-foco" class="btn-fechar-overlay" aria-label="fechar modo foco">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <div id="modo-foco-lista" class="modo-foco-lista"></div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/share.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
