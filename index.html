<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treinos</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <nav class="tabs">
    <button class="tab-btn active" data-screen="historico">Histórico</button>
    <button class="tab-btn" data-screen="treinos">Treinos</button>
    <button class="tab-btn" data-screen="registrar">Registrar</button>
  </nav>

  <!-- HISTÓRICO -->
  <section id="screen-historico" class="screen active">
    <h1>Histórico</h1>

    <div class="card">
      <h2>Progressão por exercício</h2>
      <select id="filtro-exercicio"></select>
      <canvas id="grafico" width="320" height="200"></canvas>
      <p id="grafico-vazio" class="hint hidden">Sem dados suficientes para esse exercício.</p>
    </div>

    <div class="card">
      <div class="row-between">
        <h2>Calendário</h2>
        <span id="calendario-mes" class="hint"></span>
      </div>
      <div class="calendario-header-row">
        <span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span>
      </div>
      <div class="calendario-grid" id="calendario-grid"></div>
    </div>

    <div class="card">
      <div class="row-between">
        <h2>Sessões</h2>
        <div>
          <button id="btn-export" class="btn-secondary">Exportar</button>
          <label class="btn-secondary file-label">
            Importar
            <input type="file" id="input-import" accept="application/json" hidden>
          </label>
        </div>
      </div>
      <div id="lista-sessoes"></div>
    </div>
  </section>

  <!-- TREINOS -->
  <section id="screen-treinos" class="screen">
    <h1>Treinos</h1>
    <div id="lista-treinos"></div>
  </section>

  <!-- REGISTRAR -->
  <section id="screen-registrar" class="screen">
    <h1>Registrar</h1>
    <div class="card">
      <label>Treino realizado</label>
      <select id="select-treino-registrar"></select>

      <label class="checkbox-label">
        <input type="checkbox" id="check-data-especifica">
        Definir data/horário específico
      </label>
      <input type="datetime-local" id="input-data-especifica" class="hidden">

      <label>Duração do treino (minutos)</label>
      <input type="number" id="input-duracao" min="0" placeholder="Ex: 60">

      <div id="form-exercicios-registrar"></div>
      <label>Observação</label>
      <textarea id="observacao-sessao" rows="3" placeholder="Como foi o treino?"></textarea>
      <button id="btn-salvar-sessao" class="btn-primary">Salvar sessão</button>
      <p id="msg-sessao-salva" class="hint hidden">Sessão salva!</p>
    </div>
  </section>

  <script src="js/storage.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
